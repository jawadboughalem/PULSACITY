name: Database migration

# Manual only. Applying a migration is a deliberate act, never a side effect of a push.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the connection string is configured
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::Secret DIRECT_DATABASE_URL absent. Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Drizzle records what it applied, so re-running this is a no-op.
      - name: Migrate
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:migrate
