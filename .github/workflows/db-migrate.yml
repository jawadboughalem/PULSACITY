name: Database migration

# Manual only. Applying a migration is a deliberate act, never a side effect of a push.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The secret is masked wherever it appears, so a refused password is otherwise
      # indistinguishable from a malformed one. This states what the string will do.
      - name: Describe the connection string
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:check-url

      # Drizzle records what it applied, so re-running this is a no-op.
      - name: Migrate
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:migrate
