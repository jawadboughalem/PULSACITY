name: Recette demo space

# Fills the demo space "Julie Nutrition" for an address, on the recette database only.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse e-mail du compte de recette"
        required: true
      plan:
        description: "Plan de l'espace"
        required: true
        default: free
        type: choice
        options: [free, essentiel, pro]

permissions:
  contents: read

jobs:
  seed:
    name: Fill the demo space
    runs-on: ubuntu-latest
    steps:
      - name: Check that the recette database is configured
        env:
          RECETTE_DATABASE_URL: ${{ secrets.RECETTE_DATABASE_URL }}
        run: |
          if [ -z "$RECETTE_DATABASE_URL" ]; then
            echo "::error::The repository secret RECETTE_DATABASE_URL is missing. See docs-internes/recette/environnement-recette.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:seed "$SEED_EMAIL" "--plan=$SEED_PLAN" --recette
        env:
          DATABASE_URL: ${{ secrets.RECETTE_DATABASE_URL }}
          SEED_EMAIL: ${{ inputs.email }}
          SEED_PLAN: ${{ inputs.plan }}
